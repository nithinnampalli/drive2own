    <!-- Restore path after GitHub Pages 404 redirect -->
    <script type="text/javascript">
      // Restore the original path after a GitHub Pages 404 redirect.
      // 404.html encodes the path as a query string starting with "/?/…".
      // We detect that pattern (search[1] === '/'), decode it, and replace
      // the current history entry so React Router sees the real URL.
      (function(l) {
        // search[1] === '/' means the query starts with "/?/" — our redirect marker
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          // l.pathname ends with '/' (e.g. "/drive2own/"), so slice(0, -1)
          // removes the trailing slash before prepending the decoded path.
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <title>Drive2Own</title>
  </head>
